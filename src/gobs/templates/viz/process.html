<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>过程</title>
<style>
  :root {
    --bg: #fafbfc;
    --ink: #2c3338;
    --muted: #6b7280;
    --high: #b4533a;
    --query: #3d5a73;
    --mid: #6d7f4f;
    --card: #ffffff;
    --line: #c5cad0;
    --box: #eef1f4;
    --query-fill: #d9e3ee;
    --high-fill: #f3e4e0;
    --low: #9aa3ad;
    --hush: #d4d8dc;
    --clear: #3d5a73;
    --ok: #3d6b4f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Source Han Sans SC",
      "Microsoft YaHei", system-ui, sans-serif;
    font-size: 16px; line-height: 1.45;
  }
  body { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
  body.embed { max-width: none; padding: 10px 12px 16px; }
  h1 { font-size: 1.35rem; font-weight: 650; letter-spacing: 0.02em; margin: 4px 0 6px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 0.92rem; }
  .tag {
    display: inline-block; margin-left: 8px; padding: 1px 7px;
    border: 1px solid var(--line); color: var(--muted);
    font-size: 0.72rem; letter-spacing: 0.04em; font-weight: 600;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; align-items: center; }
  button, .word {
    min-height: 40px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink);
    font: inherit; font-weight: 600; padding: 7px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--query); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.on {
    background: var(--query); border-color: var(--query); color: #fff;
  }
  button.ghost { background: transparent; }
  button.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  input[type="text"] {
    flex: 1; min-width: 200px; min-height: 40px; font: inherit;
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px;
    background: #fff; color: var(--ink);
  }
  .step-n { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 7.5em; text-align: center; }
  .cap {
    margin: 4px 0 8px; min-height: 1.4em; font-weight: 650; color: var(--ink);
  }
  .cap .who { color: var(--high); }
  .stage { position: relative; margin: 8px 0 6px; }
  svg.arcs { display: block; width: 100%; height: 96px; }
  .words {
    display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-end;
    min-height: 56px;
  }
  .col { display: flex; flex-direction: column; align-items: stretch; gap: 6px; min-width: 64px; }
  .word { min-width: 64px; text-align: center; background: var(--box); position: relative; }
  .word small {
    display: block; font-size: 0.68rem; font-weight: 700; color: var(--muted); margin-top: 2px;
  }
  .word.now { border-color: var(--query); background: var(--query-fill); color: var(--query); }
  .word.done { opacity: 0.72; }
  .word.wait { opacity: 0.42; }
  .word.ask { border-color: var(--query); background: var(--query-fill); color: var(--query); border-width: 2px; }
  .word.hi { border-color: var(--high); background: var(--high-fill); color: var(--high); }
  .word.lo { border-color: var(--low); background: #eef0f2; color: #4b5563; }
  .word.mid { border-color: var(--mid); background: #e8eddf; color: var(--mid); }
  .bar {
    height: 22px; border: 1px solid #c5cad0; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 700; color: var(--ink);
  }
  .bar.empty { background: transparent; border-style: dashed; color: transparent; }
  .side {
    color: var(--muted); font-size: 0.78rem; margin: 2px 0 10px;
  }
  .legend { color: var(--muted); font-size: 0.82rem; margin: 6px 0 10px; }
  .toast { min-height: 1.6em; margin-top: 8px; color: var(--ok); font-weight: 650; }
  .toast.bad { color: var(--high); }
  .preview {
    white-space: pre-wrap; background: var(--ink); color: #f3f4f6;
    border-radius: 6px; padding: 12px; font-size: 0.82rem; margin-top: 10px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .hr { height: 1px; background: var(--line); margin: 14px 0; border: 0; }
  .src { color: var(--muted); font-size: 0.78rem; margin: 0 0 8px; }
</style>
</head>
<body>
  <h1>过程<span class="tag" id="kind-tag">示意</span></h1>
  <p class="sub">你点一步看一步。刚学按论文标高低，不能把每个词都点成高。示意，不是训练好的模型。</p>
  <p class="src" id="source"></p>

  <div class="row" id="sentence-row">
    <input id="sentence" type="text" value="The animal didn't cross the street because it was too tired" aria-label="句子">
    <button type="button" id="apply">应用</button>
  </div>

  <div class="row" role="group" aria-label="模式" id="kind-row">
    <button type="button" class="on" id="mode-queue">没有它（排队传话）</button>
    <button type="button" id="mode-attn">有 attention</button>
  </div>

  <div class="row">
    <button type="button" id="prev">上一步</button>
    <strong class="step-n" id="step-n">第 1 / 11 步</strong>
    <button type="button" id="next">下一步</button>
  </div>

  <p class="cap" id="caption">到这一步，包里的 animal 还清楚。</p>
  <p class="side" id="side">印象包里的 animal：越往后越淡。</p>

  <div class="stage">
    <svg class="arcs" id="arcs" aria-hidden="true"></svg>
    <div class="words" id="words"></div>
  </div>
  <p class="legend" id="legend">点词跳到那一步。左 / 右方向键也可步进。</p>

  <div class="row">
    <button type="button" class="primary" id="copy">复制到笔记</button>
    <button type="button" class="ghost" id="try">自己试</button>
    <button type="button" class="ghost" id="paper">按论文</button>
    <button type="button" class="primary" id="submit" hidden>交卷</button>
  </div>
  <div class="toast" id="toast"></div>
  <pre class="preview" id="preview" hidden></pre>

<script>
(function () {
  var DEFAULT_SENTENCE = "The animal didn't cross the street because it was too tired";
  var DEFAULT_SPEC = {
    kind: "attention",
    mode: "teach",
    phase: "encode",
    source: "Attention Is All You Need — coreference example",
    sentence: DEFAULT_SENTENCE,
    tokens: DEFAULT_SENTENCE.split(/\s+/),
    query: "it",
    paper: { animal: "hi", street: "lo", tired: "mid" },
    reveal: [
      { token: "animal", weight: "hi", why: "没过马路的是动物。它 = animal。" },
      { token: "street", weight: "lo", why: "马路不会累。street 低。" },
      { token: "tired", weight: "mid", why: "累是原因，不是「它」指的东西。" }
    ],
    caption: "「它」在看谁"
  };

  var spec = DEFAULT_SPEC;
  var fromFile = false;
  var tokens = [];
  var step = 1;
  var attn = false;
  var weights = {};
  var animalI = -1;
  var streetI = -1;
  var tiredI = -1;
  var askI = -1;
  var packetI = -1;
  var paperLock = true;
  var wordEls = [];
  var teach = true;

  function $(id) { return document.getElementById(id); }

  function splitWords(s) {
    return String(s || "").trim().split(/\s+/).filter(Boolean);
  }

  function bare(w) {
    return String(w || "").replace(/[.,!?;:"'()]/g, "").toLowerCase();
  }

  function findNamed(names) {
    for (var i = 0; i < tokens.length; i++) {
      var t = bare(tokens[i]);
      for (var j = 0; j < names.length; j++) {
        if (t === names[j]) return i;
      }
    }
    return -1;
  }

  function findToken(name) {
    return findNamed([bare(name)]);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function toast(msg, bad) {
    var el = $("toast");
    el.textContent = msg || "";
    el.className = "toast" + (bad ? " bad" : "");
  }

  function showPrev(text) {
    var el = $("preview");
    el.hidden = !text;
    el.textContent = text || "";
  }

  function copyText(text) {
    function ok() { toast("已复制，去笔记里粘贴。"); showPrev(text); }
    function fail() { toast("复制失败：请手动选中下面的字。"); showPrev(text); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok).catch(function () {
        try {
          var ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
          ok();
        } catch (e) { fail(); }
      });
    } else {
      try {
        var ta2 = document.createElement("textarea");
        ta2.value = text;
        document.body.appendChild(ta2);
        ta2.select();
        document.execCommand("copy");
        ta2.remove();
        ok();
      } catch (e) { fail(); }
    }
  }

  function mix(a, b, t) {
    function rgb(h) {
      h = h.replace("#", "");
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    var A = rgb(a), B = rgb(b);
    var r = Math.round((1 - t) * A[0] + t * B[0]);
    var g = Math.round((1 - t) * A[1] + t * B[1]);
    var bl = Math.round((1 - t) * A[2] + t * B[2]);
    return "#" + [r, g, bl].map(function (n) {
      var s = n.toString(16);
      return s.length === 1 ? "0" + s : s;
    }).join("");
  }

  function paperTargets() {
    var out = [];
    var seen = {};
    var rev = (spec && spec.reveal) || [];
    for (var i = 0; i < rev.length; i++) {
      var tok = rev[i].token;
      var idx = findToken(tok);
      if (idx < 0) continue;
      out.push({ i: idx, w: rev[i].weight || "hi", why: rev[i].why || "", token: tok });
      seen[bare(tok)] = true;
    }
    if (!out.length && spec && spec.paper) {
      Object.keys(spec.paper).forEach(function (k) {
        var idx = findToken(k);
        if (idx >= 0) out.push({ i: idx, w: spec.paper[k], why: "", token: k });
      });
    }
    if (!out.length) {
      if (animalI >= 0) out.push({ i: animalI, w: "hi", why: "没过马路的是动物。它 = animal。", token: "animal" });
      if (streetI >= 0) out.push({ i: streetI, w: "lo", why: "马路不会累。street 低。", token: "street" });
      if (tiredI >= 0) out.push({ i: tiredI, w: "mid", why: "累是原因，不是「它」指的东西。", token: "tired" });
    }
    return out;
  }

  function canPaper() {
    return paperTargets().length > 0 && askI >= 0;
  }

  function applyPaperReveal() {
    weights = {};
    if (!attn || !paperLock || !canPaper()) return;
    var tg = paperTargets();
    var shown = Math.max(0, step - 1);
    tg.slice(0, shown).forEach(function (x) { weights[x.i] = x.w; });
  }

  function attnMax() {
    if (attn && paperLock && canPaper()) return paperTargets().length + 1;
    return tokens.length || 1;
  }

  function clampStep() {
    var n = attnMax();
    if (step < 1) step = 1;
    if (step > n) step = n;
  }

  function packetClarity(i) {
    if (packetI < 0) return 0.15;
    if (i < packetI) return 0.15;
    return Math.exp(-0.55 * (i - packetI));
  }

  function packetBlurred() {
    if (askI >= 0 && step - 1 >= askI) return true;
    return false;
  }

  function packetName() {
    if (packetI >= 0) return tokens[packetI];
    return "animal";
  }

  function applySentence(raw) {
    var src = raw || (spec && spec.sentence) || $("sentence").value || DEFAULT_SENTENCE;
    tokens = (spec && spec.tokens && spec.tokens.length && !raw)
      ? spec.tokens.slice()
      : splitWords(src);
    if (!tokens.length) tokens = splitWords(DEFAULT_SENTENCE);
    $("sentence").value = tokens.join(" ");
    animalI = findNamed(["animal"]);
    streetI = findNamed(["street"]);
    tiredI = findNamed(["tired"]);
    var q = (spec && spec.query) || "it";
    askI = findNamed([bare(q), "it", "它"]);
    if (askI < 0) askI = tokens.length ? tokens.length - 1 : -1;
    packetI = animalI;
    if (packetI < 0) {
      var tg = paperTargets();
      for (var i = 0; i < tg.length; i++) {
        if (tg[i].w === "hi") { packetI = tg[i].i; break; }
      }
    }
    if (packetI < 0 && tg && tg.length) packetI = tg[0].i;
    step = 1;
    weights = {};
    paperLock = teach || (!fromFile);
    if (fromFile && !teach) paperLock = false;
    render();
  }

  function applySpec(next, loaded) {
    spec = next || DEFAULT_SPEC;
    fromFile = !!loaded;
    teach = (spec.mode || "teach") !== "test";
    var kind = spec.kind || "attention";
    attn = kind === "attention";
    $("kind-tag").textContent = teach ? "教课" : "测验";
    $("source").textContent = spec.source || "";
    $("sentence").value = spec.sentence || (spec.tokens || []).join(" ");
    if (fromFile) {
      $("sentence").readOnly = true;
      $("apply").hidden = true;
      $("kind-row").hidden = true;
    } else {
      $("sentence").readOnly = false;
      $("apply").hidden = false;
      $("kind-row").hidden = false;
    }
    $("submit").hidden = teach;
    $("try").hidden = fromFile && teach;
    $("paper").hidden = fromFile && teach;
    applySentence(null);
  }

  function onWordClick(i) {
    if (attn && paperLock && canPaper()) {
      var tg = paperTargets();
      if (i === askI) { step = 1; render(); return; }
      for (var k = 0; k < tg.length; k++) {
        if (tg[k].i === i) { step = k + 2; render(); return; }
      }
      return;
    }
    if (attn) {
      if (i === askI) return;
      if (weights[i] === "hi") weights[i] = "mid";
      else if (weights[i] === "mid") weights[i] = "lo";
      else if (weights[i] === "lo") delete weights[i];
      else weights[i] = "hi";
      render();
      return;
    }
    step = i + 1;
    render();
  }

  function render() {
    if (attn && paperLock && canPaper()) applyPaperReveal();
    clampStep();
    var n = attnMax();
    $("step-n").textContent = "第 " + step + " / " + n + " 步";
    $("prev").disabled = step <= 1;
    $("next").disabled = step >= n;
    $("mode-queue").className = attn ? "" : "on";
    $("mode-attn").className = attn ? "on" : "";
    var tryBtn = $("try");
    var paperBtn = $("paper");
    if (tryBtn) tryBtn.style.display = (attn && !(fromFile && teach)) ? "" : "none";
    if (paperBtn) paperBtn.style.display = (attn && !(fromFile && teach)) ? "" : "none";
    if (tryBtn) tryBtn.className = (!paperLock && attn) ? "on" : "ghost";
    if (paperBtn) paperBtn.className = (paperLock && attn) ? "on" : "ghost";
    $("submit").hidden = teach || !attn;

    if (attn) {
      $("caption").innerHTML = paperCaption();
      if (paperLock && canPaper()) {
        $("side").textContent = "刚学按论文标。点下一步揭开，不能改高低。";
        $("legend").textContent = "问词是 " + ((spec && spec.query) || "it") + "。示意权重，对应该句的指代，不是训练好的矩阵。";
      } else {
        $("side").textContent = teach
          ? "自己试：点词循环 无 → 高 → 中 → 低 → 无。课上仍以论文标为准。"
          : "测验：自己标高低，标完交卷。不能把每个词都涂成高（除非论文就是这样）。";
        $("legend").textContent = teach
          ? "问词是 " + ((spec && spec.query) || "it") + "。自己试可以乱点；真实情况请切回「按论文」。"
          : "点词循环 无 → 高 → 中 → 低 → 无。交卷后对照论文。";
      }
    } else {
      var name = packetName();
      var blurred = packetBlurred();
      $("caption").textContent = blurred
        ? "到这一步，包里的 " + name + " 已糊。"
        : "到这一步，包里的 " + name + " 还清楚。";
      $("side").textContent = "印象包里的 " + name + "：从它起按距离变淡。到问词标 糊。";
      $("legend").textContent = "点词跳到那一步。左 / 右方向键也可步进。";
    }

    var box = $("words");
    box.innerHTML = "";
    wordEls = [];
    tokens.forEach(function (w, i) {
      var col = document.createElement("div");
      col.className = "col";
      var b = document.createElement("button");
      b.type = "button";
      b.className = "word";
      b.dataset.i = String(i);
      var tag = "";
      if (attn) {
        if (i === askI) { b.classList.add("ask"); tag = "问"; }
        if (weights[i] === "hi") { b.classList.add("hi"); tag = "高"; }
        if (weights[i] === "mid") { b.classList.add("mid"); tag = "中"; }
        if (weights[i] === "lo") { b.classList.add("lo"); tag = "低"; }
      } else {
        if (i + 1 === step) b.classList.add("now");
        else if (i + 1 < step) b.classList.add("done");
        else b.classList.add("wait");
      }
      b.innerHTML = escapeHtml(w) + (tag ? "<small>" + tag + "</small>" : "");
      b.addEventListener("click", function () { onWordClick(i); });
      col.appendChild(b);
      if (!attn) {
        var bar = document.createElement("div");
        bar.className = "bar";
        if (i + 1 > step) {
          bar.classList.add("empty");
          bar.textContent = "·";
        } else {
          var t = packetClarity(i);
          bar.style.background = mix("#3d5a73", "#d4d8dc", 1 - t);
          bar.style.color = t > 0.35 ? "#fff" : "#2c3338";
          if (packetI >= 0 && i === packetI) bar.textContent = tokens[packetI];
          else if (askI >= 0 && i === askI) bar.textContent = "糊";
          else bar.textContent = "";
        }
        col.appendChild(bar);
      }
      box.appendChild(col);
      wordEls.push(b);
    });
    drawArcs();
  }

  function attnWhoLine() {
    var hi = [], mid = [], lo = [];
    Object.keys(weights).forEach(function (k) {
      var i = Number(k);
      if (weights[k] === "hi") hi.push(tokens[i]);
      if (weights[k] === "mid") mid.push(tokens[i]);
      if (weights[k] === "lo") lo.push(tokens[i]);
    });
    var bits = [];
    if (hi.length) bits.push("<span class=\"who\">" + escapeHtml(hi.join("、")) + " 高</span>");
    if (mid.length) bits.push(escapeHtml(mid.join("、")) + " 中");
    if (lo.length) bits.push(escapeHtml(lo.join("、")) + " 低");
    return bits.length ? "：" + bits.join("，") : "。";
  }

  function paperCaption() {
    var cap = (spec && spec.caption) || "「它」在看谁";
    if (paperLock && canPaper()) {
      var tg = paperTargets();
      if (step <= 1) return "问词是 " + ((spec && spec.query) || "it") + "。先看它在说谁。";
      var x = tg[step - 2];
      if (x) return (x.why || cap) + attnWhoLine();
    }
    return cap + attnWhoLine();
  }

  function drawArcs() {
    var svg = $("arcs");
    svg.innerHTML = "";
    if (!attn || askI < 0) {
      svg.style.height = "28px";
      svg.setAttribute("viewBox", "0 0 100 28");
      return;
    }
    var keys = Object.keys(weights);
    if (!keys.length) {
      svg.style.height = "48px";
      svg.setAttribute("viewBox", "0 0 100 48");
      return;
    }
    var wrap = $("words");
    var wr = wrap.getBoundingClientRect();
    var W = Math.max(wr.width || 600, 200);
    var H = 96;
    svg.style.height = H + "px";
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    var qb = wordEls[askI];
    if (!qb) return;
    var qr = qb.getBoundingClientRect();
    var x1 = qr.left + qr.width / 2 - wr.left;
    var y1 = H - 6;
    keys.forEach(function (k) {
      var i = Number(k);
      var tb = wordEls[i];
      if (!tb) return;
      var tr = tb.getBoundingClientRect();
      var x2 = tr.left + tr.width / 2 - wr.left;
      var y2 = H - 6;
      var lift = 28 + Math.min(52, Math.abs(x2 - x1) * 0.22);
      var cpx = (x1 + x2) / 2;
      var cpy = H - lift;
      var kind = weights[i];
      var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", "M " + x1 + " " + y1 + " Q " + cpx + " " + cpy + " " + x2 + " " + y2);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", kind === "hi" ? "#b4533a" : (kind === "mid" ? "#6d7f4f" : "#9aa3ad"));
      path.setAttribute("stroke-width", kind === "hi" ? "5.2" : (kind === "mid" ? "2.6" : "1.5"));
      path.setAttribute("stroke-linecap", "round");
      if (kind === "lo") path.setAttribute("stroke-dasharray", "5 4");
      svg.appendChild(path);
    });
  }

  function currentWeightsByToken() {
    var out = {};
    Object.keys(weights).forEach(function (k) {
      var i = Number(k);
      if (tokens[i]) out[tokens[i]] = weights[k];
    });
    return out;
  }

  function exportNote() {
    var n = tokens.length;
    if (!n) { toast("先写一句。"); return; }
    var text = "## 双编码\n\n";
    if (attn) {
      var src = askI >= 0 ? tokens[askI] : ((spec && spec.query) || "it");
      var lines = ["flowchart LR", "  src[\"" + src + "\"]"];
      var hi = [], mid = [], lo = [];
      var k = 0;
      Object.keys(weights).forEach(function (key) {
        var w = tokens[Number(key)];
        var id = "t" + k;
        k += 1;
        lines.push("  " + id + "[\"" + w + "\"]");
        if (weights[key] === "hi") {
          lines.push("  src ==>|高| " + id);
          hi.push(w);
        } else if (weights[key] === "mid") {
          lines.push("  src -->|中| " + id);
          mid.push(w);
        } else {
          lines.push("  src -.->|低| " + id);
          lo.push(w);
        }
      });
      text += "有 attention。第 " + step + " / " + n + " 步。" + ((spec && spec.caption) || "「它」在看谁") + "。\n\n";
      if (!hi.length && !lo.length) {
        text += "还没点权。问词是 " + src + "。\n";
      } else {
        text += "```mermaid\n" + lines.join("\n") + "\n```\n\n";
        if (hi.length) text += "高：" + hi.join("、") + "。\n";
        if (mid.length) text += "中：" + mid.join("、") + "。\n";
        if (lo.length) text += "低：" + lo.join("、") + "。\n";
      }
      text += "\n只要记住：问词一次看全句，权重大的先算。示意，不是训练好的模型。\n";
    } else {
      var play = step - 1;
      var chain = tokens.map(function (w, i) {
        return i === play ? "[" + w + "]" : w;
      }).join(" -> ");
      var ascii = tokens.join(" ");
      var blurred = packetBlurred();
      var name = packetName();
      text += "没有它（排队传话）第 " + step + " / " + n + " 步。\n\n";
      text += chain + "\n\n";
      text += (blurred ? "到这一步，包里的 " + name + " 已糊。" : "到这一步，包里的 " + name + " 还清楚。") + "\n\n";
      var mer = ["flowchart LR"];
      tokens.forEach(function (w, i) {
        mer.push("  t" + i + "[\"" + w + "\"]");
        if (i > 0 && i <= play) mer.push("  t" + (i - 1) + " --> t" + i);
        if (i > 0 && i > play) mer.push("  t" + (i - 1) + " -.-> t" + i);
      });
      text += "```mermaid\n" + mer.join("\n") + "\n```\n\n";
      text += "ASCII：" + ascii + "\n";
      text += "只要记住：排队传到问词时，包里的 " + name + " 已经被挤糊。\n";
    }
    copyText(text);
  }

  function submitAttempt() {
    var payload = { weights: currentWeightsByToken() };
    fetch("/judge", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); }).then(function (j) {
      toast(j.verdict || (j.ok ? "通过。" : "未过。"), !j.ok);
    }).catch(function () {
      toast("课桌不在。终端跑：gobs learn judge --attempt attempt.json", true);
      showPrev(JSON.stringify(payload, null, 2));
    });
  }

  function loadFigure() {
    var tries = ["/figure", "figure.json"];
    function next(i) {
      if (i >= tries.length) {
        applySpec(DEFAULT_SPEC, false);
        return;
      }
      fetch(tries[i], { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("no");
        return r.json();
      }).then(function (j) {
        if (!j || !j.kind && !j.tokens && !j.sentence) throw new Error("empty");
        applySpec(j, true);
      }).catch(function () { next(i + 1); });
    }
    next(0);
  }

  $("apply").addEventListener("click", function () {
    if (fromFile) return;
    spec = Object.assign({}, spec, { sentence: $("sentence").value, tokens: splitWords($("sentence").value) });
    applySentence($("sentence").value);
    toast("");
  });
  $("prev").addEventListener("click", function () { step -= 1; render(); });
  $("next").addEventListener("click", function () { step += 1; render(); });
  $("mode-queue").addEventListener("click", function () {
    if (fromFile) return;
    attn = false;
    step = 1;
    render();
  });
  $("mode-attn").addEventListener("click", function () {
    if (fromFile) return;
    attn = true;
    paperLock = canPaper() ? true : false;
    step = 1;
    weights = {};
    render();
  });
  $("copy").addEventListener("click", exportNote);
  $("try").addEventListener("click", function () {
    if (fromFile && teach) return;
    paperLock = false;
    toast("自己试。课上仍以论文标为准。");
    render();
  });
  $("paper").addEventListener("click", function () {
    paperLock = true;
    step = 1;
    weights = {};
    toast("已按论文重标。");
    render();
  });
  $("submit").addEventListener("click", submitAttempt);

  document.addEventListener("keydown", function (ev) {
    var tag = (ev.target && ev.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (ev.key === "ArrowLeft") { ev.preventDefault(); step -= 1; render(); }
    if (ev.key === "ArrowRight") { ev.preventDefault(); step += 1; render(); }
  });
  window.addEventListener("resize", drawArcs);
  if (window.parent !== window) document.body.classList.add("embed");

  applySpec(DEFAULT_SPEC, false);
  loadFigure();
})();
</script>
</body>
</html>
